    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(145deg, #111927, #0d1520);
            border-radius: 28px;
            padding: 40px 24px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* ===== GLOW BORDER ANIMATION ===== */
        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #f5c842, #ff8a00, #f5c842, #ff8a00);
            background-size: 400% 400%;
            border-radius: 30px;
            z-index: -1;
            animation: glowBorder 3s ease infinite;
            opacity: 0.4;
        }

        @keyframes glowBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== TIMER CIRCLE ===== */
        .timer-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .timer-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(#f5c842 0deg, #1a2332 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            position: relative;
        }

        .timer-circle-inner {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #0d1520;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .timer-number {
            font-size: 48px;
            font-weight: 800;
            color: #f5c842;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .timer-label {
            font-size: 11px;
            color: #667799;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* ===== PROGRESS BAR (Alternative) ===== */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #1a2332;
            border-radius: 4px;
            margin: 16px 0 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5c842, #ff8a00);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        /* ===== MAIN MESSAGE ===== */
        .main-message {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .main-message .highlight {
            background: linear-gradient(135deg, #f5c842, #ff8a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 24px;
        }

        .sub-message {
            font-size: 14px;
            color: #8899bb;
            margin-bottom: 16px;
        }

        .sub-message strong {
            color: #fff;
        }

        /* ===== STATUS TEXT ===== */
        .status-text {
            font-size: 13px;
            color: #667799;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        .status-text .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f5c842;
            margin-right: 8px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ===== FEATURES (Small) ===== */
        .mini-features {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            font-size: 11px;
            color: #445566;
        }

        .mini-features span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== REDIRECTING ANIMATION ===== */
        .redirecting {
            display: none;
            margin-top: 12px;
            padding: 10px;
            background: rgba(245, 200, 66, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(245, 200, 66, 0.15);
            color: #f5c842;
            font-size: 14px;
            font-weight: 600;
        }

        .redirecting.show {
            display: block;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            .container { padding: 28px 16px 24px; }
            .main-message { font-size: 18px; }
            .main-message .highlight { font-size: 20px; }
            .timer-wrapper { width: 100px; height: 100px; }
            .timer-circle { width: 100px; height: 100px; }
            .timer-circle-inner { width: 84px; height: 84px; }
            .timer-number { font-size: 38px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== TIMER CIRCLE ===== -->
        <div class="timer-wrapper">
            <div class="timer-circle" id="timerCircle">
                <div class="timer-circle-inner">
                    <div class="timer-number" id="timerDisplay">3</div>
                    <div class="timer-label">Seconds</div>
                </div>
            </div>
        </div>

        <!-- ===== PROGRESS BAR ===== -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- ===== MAIN MESSAGE ===== -->
        <div class="main-message">
            🚀 <span class="highlight">Aapki Profit</span><br />
            Hamari Jimmedari ✅
        </div>

        <div class="sub-message">
            <strong>DEV ARMY</strong> • Live Panel • 32ms Ping
        </div>

        <!-- ===== STATUS ===== -->
        <div class="status-text">
            <span class="dot"></span>
            <span id="statusMessage">Redirecting in 3 seconds...</span>
        </div>

        <!-- ===== REDIRECTING NOTIFICATION ===== -->
        <div class="redirecting" id="redirectingBox">
            ✅ Redirecting to DEV ARMY Channel...
        </div>

        <!-- ===== MINI FEATURES ===== -->
        <div class="mini-features">
            <span>🔒 Secure</span>
            <span>⚡ 32ms</span>
            <span>📱 578 Members</span>
        </div>

    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const TELEGRAM_LINK = 'https://t.me/+EV9k_vc6EjVlYWFl';
        const TIMER_SECONDS = 3;
        const UPDATE_INTERVAL_MS = 50; // Update every 50ms for smooth animation

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const timerDisplay = document.getElementById('timerDisplay');
        const timerCircle = document.getElementById('timerCircle');
        const progressFill = document.getElementById('progressFill');
        const statusMessage = document.getElementById('statusMessage');
        const redirectingBox = document.getElementById('redirectingBox');

        // ============================================================
        // TIMER LOGIC
        // ============================================================
        let timeLeft = TIMER_SECONDS;
        let startTime = Date.now();
        let totalDuration = TIMER_SECONDS * 1000;
        let redirectDone = false;

        // Track engagement for Meta Pixel
        let hasInteracted = false;

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, totalDuration - elapsed);
            const secondsRemaining = remaining / 1000;

            // Update display (show 1 decimal place for smoothness, but round for display)
            if (secondsRemaining > 0.5) {
                timerDisplay.textContent = Math.ceil(secondsRemaining);
            } else if (secondsRemaining > 0) {
                timerDisplay.textContent = '1';
            } else {
                timerDisplay.textContent = '0';
            }

            // Update progress circle (conic gradient)
            const progress = 1 - (remaining / totalDuration);
            const degrees = progress * 360;
            timerCircle.style.background = `conic-gradient(#f5c842 ${degrees}deg, #1a2332 ${degrees}deg)`;

            // Update progress bar
            progressFill.style.width = `${progress * 100}%`;

            // Update status message
            const secs = Math.ceil(secondsRemaining);
            if (secs > 0) {
                statusMessage.textContent = `⏳ Redirecting in ${secs} second${secs > 1 ? 's' : ''}...`;
            } else {
                statusMessage.textContent = '🚀 Redirecting now...';
            }

            // Check if timer is complete
            if (remaining <= 0 && !redirectDone) {
                redirectDone = true;
                performRedirect();
                return;
            }

            // Continue updating
            if (!redirectDone) {
                requestAnimationFrame(updateTimer);
            }
        }

        // ============================================================
        // REDIRECT FUNCTION
        // ============================================================
        function performRedirect() {
            // Show redirecting box
            redirectingBox.classList.add('show');

            // Update status
            statusMessage.textContent = '✅ Redirecting to DEV ARMY...';

            // Track Click for Meta Pixel
            if (typeof fbq === 'function') {
                fbq('track', 'Click', {
                    content_name: 'Auto_Redirect_Timer',
                    destination: TELEGRAM_LINK
                });
                fbq('trackCustom', 'TimerRedirect', {
                    timeWaited: TIMER_SECONDS,
                    source: 'landing_page'
                });
            }

            // Add a small delay before redirect for UX (shows the redirecting message)
            setTimeout(function() {
                window.location.href = TELEGRAM_LINK;
            }, 600);
        }

        // ============================================================
        // START TIMER
        // ============================================================
        startTime = Date.now();
        updateTimer();

        // ============================================================
        // USER INTERACTION TRACKING (For CPC optimization)
        // ============================================================
        document.addEventListener('click', function(e) {
            if (!hasInteracted) {
                hasInteracted = true;
                if (typeof fbq === 'function') {
                    fbq('trackCustom', 'PageInteraction', {
                        element: e.target.tagName
                    });
                }
            }
        });

        document.addEventListener('touchstart', function() {
            if (!hasInteracted) {
                hasInteracted = true;
                if (typeof fbq === 'function') {
                    fbq('trackCustom', 'PageInteraction', {
                        element: 'touch'
                    });
                }
            }
        });

        // ============================================================
        // META PIXEL - PAGE VIEW & LEAD (Already fired in <head>)
        // ============================================================

        // ============================================================
        // FALLBACK: If user stays on page (e.g., Telegram blocked)
        // ============================================================
        setTimeout(function() {
            if (!redirectDone) {
                // If Telegram app isn't installed, maybe show a message
                // But we already redirected via window.location
            }
        }, 5000);

        // ============================================================
        // PERFORMANCE LOGGING
        // ============================================================
        if (window.performance && window.performance.timing) {
            const loadTime = performance.timing.loadEventEnd - performance.timing.navigationStart;
            console.log('⏱️ Page loaded in:', loadTime, 'ms');
            if (loadTime > 3000 && typeof fbq === 'function') {
                fbq('trackCustom', 'SlowLoad', { loadTimeMs: loadTime });
            }
        }

        console.log('🚀 DEV ARMY Timer Landing Page');
        console.log('⏱️ Timer:', TIMER_SECONDS, 'seconds');
        console.log('🔗 Redirect to:', TELEGRAM_LINK);
        console.log('📊 Meta Pixel: 1017597647655738');
    </script>
