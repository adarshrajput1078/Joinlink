<body>

    <div class="container">
        <!-- Logo yahan add kiya gaya hai -->
        <img src="logo.png" alt="Rocky Bhai Logo" class="logo">

        <h1>Free Number SureShot🔥</h1>
        <p class="subtitle">
            Colour Trading Premium Access
            <span class="highlight">Per Day 3 Free Number Sureshot!</span>
        </p>
        
        <div class="timer-box">
            <div class="timer-text">Channel Link Expire In:</div>
            <div class="timer" id="countdown">25</div>
        </div>

        <!-- Yahan Href mein apna Telegram Link daalna hai -->
        <a href="https://t.me/+LRtglAEgxrtlNDI1" class="telegram-btn" id="teleBtn" onclick="trackPixelAndGo()">
            🚀 Join Telegram Now
        </a>
        
        <p class="footer-note">Aap automatically 25 seconds mein Telegram par redirect ho jayenge.</p>
    </div>

    <script>
        // 👇 APNA TELEGRAM LINK YAHAN BHI DAALEIN (Auto-redirect ke liye) 👇
        const TELEGRAM_LINK = "https://t.me/+LRtglAEgxrtlNDI1"; 

        let timeLeft = 25;
        const timerDisplay = document.getElementById('countdown');

        // Facebook Pixel Event Tracking Function
        function trackPixelAndGo() {
            // Button click hone par Meta Pixel ko 'Lead' bhejega
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Lead'); 
            }
        }

        // Timer and Auto-Redirect Logic
        const countdownInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                trackPixelAndGo(); // Redirect se pehle pixel fire karega
                window.location.href = TELEGRAM_LINK; // Auto Redirect
            }
        }, 1000);
    </script>
