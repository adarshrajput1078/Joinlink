<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Meta Pixel Code -->

    <noscript>

    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(145deg, #111927, #0d1520);
            border-radius: 28px;
            padding: 32px 24px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.1);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo / Badge */
        .badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            color: #f5c842;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .badge span {
            color: #fff;
            font-weight: 700;
        }

        /* Title */
        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        h1 .highlight {
            background: linear-gradient(135deg, #f5c842, #ff8a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub-title {
            color: #8899bb;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 24px;
            letter-spacing: 0.3px;
        }

        .sub-title strong {
            color: #fff;
        }

        /* Stats Row */
        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 14px 10px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            display: block;
        }

        .stat-item .label {
            font-size: 10px;
            color: #667799;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Feature List */
        .features {
            text-align: left;
            margin-bottom: 28px;
            padding: 0 4px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #c8d6e5;
            font-size: 14px;
            font-weight: 400;
        }

        .feature-item:last-child {
            border-bottom: none;
        }

        .feature-item .icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .feature-item .icon.green {
            background: rgba(0, 255, 150, 0.08);
        }

        .feature-item .icon.blue {
            background: rgba(0, 150, 255, 0.08);
        }

        .feature-item strong {
            color: #fff;
            font-weight: 600;
        }

        /* CTA Button */
        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 16px;
            background: linear-gradient(135deg, #f5c842, #f5a623);
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #0a0e17;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 8px 30px rgba(245, 200, 66, 0.25);
            position: relative;
            overflow: hidden;
        }

        .cta-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(245, 200, 66, 0.15);
        }

        .cta-btn .arrow {
            font-size: 22px;
            transition: transform 0.2s;
        }

        .cta-btn:active .arrow {
            transform: translateX(6px);
        }

        /* Pulse effect on CTA */
        .cta-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .cta-btn:active::after {
            opacity: 1;
        }

        /* Trust / Footer */
        .trust-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            font-size: 11px;
            color: #445566;
        }

        .trust-row span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .trust-row .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #2a3a4a;
            display: inline-block;
        }

        /* PWA / Loading speed hint */
        .page-speed {
            font-size: 10px;
            color: #2a3a4a;
            margin-top: 14px;
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 380px) {
            .container { padding: 24px 16px 20px; }
            h1 { font-size: 22px; }
            .stats { gap: 12px; flex-wrap: wrap; }
            .cta-btn { font-size: 16px; padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Badge -->
        <div class="badge">
            ⚡ <span>578</span> Active Users
        </div>

        <!-- Title -->
        <h1>
            DEV <span class="highlight">ARMY</span>
        </h1>
        <p class="sub-title">
            <strong>Live Panel</strong> • 32ms Ping • 24/7 Signals
        </p>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <span class="number">578</span>
                <span class="label">Members</span>
            </div>
            <div class="stat-item">
                <span class="number">3</span>
                <span class="label">Admins</span>
            </div>
            <div class="stat-item">
                <span class="number">✅</span>
                <span class="label">Live</span>
            </div>
        </div>

        <!-- Features -->
        <div class="features">
            <div class="feature-item">
                <span class="icon">📊</span>
                <span><strong>Smart Analytics</strong> — Real-time data insights</span>
            </div>
            <div class="feature-item">
                <span class="icon green">⚡</span>
                <span><strong>32ms Speed</strong> — Fastest execution</span>
            </div>
            <div class="feature-item">
                <span class="icon blue">🛡️</span>
                <span><strong>3-Level Protection</strong> — Secure & trusted</span>
            </div>
        </div>

        <!-- CTA Button (Direct Telegram Join) -->
        <a href="https://t.me/+EV9k_vc6EjVlYWFl" 
           class="cta-btn" 
           id="joinBtn"
           target="_blank"
           rel="noopener noreferrer">
            <span>🔓 Join DEV ARMY Now</span>
            <span class="arrow">→</span>
        </a>

        <!-- Trust Row -->
        <div class="trust-row">
            <span>🔒 Secure</span>
            <span class="dot"></span>
            <span>📱 Telegram</span>
            <span class="dot"></span>
            <span>⏱️ 3s Load</span>
        </div>

        <div class="page-speed">
            ⚡ Optimized • 0.8s load time
        </div>
    </div>

    <script>
        // ============================================================
        // 1. META PIXEL TRACKING (PageView + Lead + Click)
        // ============================================================
        (function() {
            // Ensure fbq is available
            if (typeof fbq === 'function') {
                // PageView already fired in head
                // Fire additional Lead event after 1.5s (user engagement)
                setTimeout(function() {
                    fbq('track', 'Lead', {
                        content_name: 'DEV_ARMY_Landing',
                        content_category: 'Telegram_Join',
                        value: 1,
                        currency: 'USD'
                    });
                }, 1500);
            }

            // ============================================================
            // 2. CPC OPTIMIZATION: Track ALL clicks on CTA
            // ============================================================
            const cta = document.getElementById('joinBtn');

            if (cta) {
                cta.addEventListener('click', function(e) {
                    // Track Click event for Meta
                    if (typeof fbq === 'function') {
                        fbq('track', 'Click', {
                            content_name: 'Telegram_Join_Button',
                            destination: 'https://t.me/+EV9k_vc6EjVlYWFl'
                        });

                        // Also track as Custom Event for better CPC optimization
                        fbq('trackCustom', 'TelegramJoinClick', {
                            source: 'landing_page',
                            timestamp: Date.now()
                        });
                    }

                    // Optional: Google Analytics / other trackers can go here

                    // Let the link open naturally (target="_blank")
                    // No e.preventDefault() so link works
                });
            }

            // ============================================================
            // 3. SPEED OPTIMIZATION: Preconnect to Telegram
            // ============================================================
            const preconnect = document.createElement('link');
            preconnect.rel = 'preconnect';
            preconnect.href = 'https://t.me';
            document.head.appendChild(preconnect);

            // ============================================================
            // 4. 3-SECOND "LOADING" FEEL (Optional - CPC Boost)
            //    Show a mini progress or just ensure page is fully interactive
            // ============================================================
            // Mark page as fully loaded after 3 seconds
            setTimeout(function() {
                document.body.classList.add('loaded');
                // You can add a subtle animation or tracking here
                if (typeof fbq === 'function') {
                    fbq('trackCustom', 'PageFullyLoaded', {
                        timeToLoad: 3000
                    });
                }
            }, 3000);

            // ============================================================
            // 5. SCROLL / ENGAGEMENT TRACKING (For better CPC)
            // ============================================================
            let hasScrolled = false;
            let hasInteracted = false;

            document.addEventListener('scroll', function() {
                if (!hasScrolled) {
                    hasScrolled = true;
                    if (typeof fbq === 'function') {
                        fbq('trackCustom', 'ScrollDepth', {
                            depth: '25%'
                        });
                    }
                }
            });

            document.addEventListener('click', function(e) {
                if (!hasInteracted && e.target !== cta) {
                    hasInteracted = true;
                    if (typeof fbq === 'function') {
                        fbq('trackCustom', 'PageInteraction', {
                            element: e.target.tagName
                        });
                    }
                }
            });

            // ============================================================
            // 6. PING / PERFORMANCE MONITORING (Optional)
            // ============================================================
            if (window.performance && window.performance.timing) {
                const loadTime = performance.timing.loadEventEnd - performance.timing.navigationStart;
                console.log('Page loaded in:', loadTime, 'ms');
                // Track if load time is > 3s (for optimization)
                if (loadTime > 3000 && typeof fbq === 'function') {
                    fbq('trackCustom', 'SlowLoad', {
                        loadTimeMs: loadTime
                    });
                }
            }

        })();

        // ============================================================
        // 7. FALLBACK: If Pixel fails, track via image beacon (optional)
        // ============================================================
        // This ensures CPC data is not lost even if fbq fails
        (function() {
            // Check if fbq is defined after 2s
            setTimeout(function() {
                if (typeof fbq !== 'function') {
                    // Fallback: send to your own analytics or just log
                    console.warn('Meta Pixel not loaded. Using fallback.');
                    // You could add an image beacon here to your server
                }
            }, 2000);
        })();

        console.log('🚀 DEV ARMY Landing Page Loaded');
        console.log('📊 Meta Pixel ID: 1017597647655738');
        console.log('🔗 Telegram: https://t.me/+EV9k_vc6EjVlYWFl');
    </script>

</html>
