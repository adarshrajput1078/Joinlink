<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>DEV PDF KING</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-base: #070b14;
            --bg-surface: #0e1526;
            --bg-chip: rgba(148, 163, 184, 0.08);
            --border-line: rgba(148, 163, 184, 0.14);
            --border-accent: rgba(59, 130, 246, 0.28);
            --green: #10b981;
            --red: #ef4444;
            --violet: #8b5cf6;
            --cta-bg: #2563eb;
            --cta-hover: #1d4ed8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatSoft {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes pulseDot {
            0%, 100% {
                opacity: 0.45;
                transform: scale(0.95);
            }
            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        body {
            background: var(--bg-base);
            background-image:
                radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.14), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.1), transparent 45%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Ambient Accent Shapes (Starts smoothly after ~1.2s) */
        .ambient-orb {
            position: fixed;
            border-radius: 999px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .ambient-orb.ready {
            opacity: 1;
        }

        .orb-left {
            width: 120px;
            height: 120px;
            top: 16%;
            left: 6%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.14), transparent 70%);
            animation: floatSoft 3.6s ease-in-out infinite;
        }

        .orb-right {
            width: 140px;
            height: 140px;
            bottom: 16%;
            right: 6%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.16), transparent 70%);
            animation: floatSoft 4s ease-in-out 0.6s infinite;
        }

        .card {
            width: 100%;
            max-width: 392px;
            background: var(--bg-surface);
            border: 1px solid var(--border-accent);
            border-radius: 18px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.65);
            position: relative;
            z-index: 5;
            animation: pageIn 0.24s ease-out both;
        }

        .mode-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--bg-chip);
            border: 1px solid var(--border-line);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .dots {
            display: inline-flex;
            gap: 4px;
        }

        .dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: pulseDot 2.2s ease-in-out infinite;
        }

        .dots span:nth-child(1) { background: var(--green); animation-delay: 0s; }
        .dots span:nth-child(2) { background: var(--red); animation-delay: 0.25s; }
        .dots span:nth-child(3) { background: var(--violet); animation-delay: 0.5s; }

        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .desc {
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .highlights {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 22px;
            text-align: left;
        }

        .hl-box {
            background: var(--bg-base);
            border: 1px solid var(--border-line);
            border-radius: 11px;
            padding: 10px 12px;
        }

        .hl-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .hl-val {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 2px;
        }

        .cta-btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 11px;
            background: var(--cta-bg);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.16s ease, transform 0.14s ease, opacity 0.16s ease;
        }

        .cta-btn:hover {
            background: var(--cta-hover);
        }

        .cta-btn:active {
            transform: scale(0.985);
        }

        .hp-trap {
            opacity: 0;
            position: absolute;
            top: -9999px;
            left: -9999px;
            height: 0;
            width: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <a href="#verify" class="hp-trap" id="honeypot" tabindex="-1" aria-hidden="true">Continue</a>

    <div class="ambient-orb orb-left" id="orbLeft" aria-hidden="true"></div>
    <div class="ambient-orb orb-right" id="orbRight" aria-hidden="true"></div>

    <main class="card">
        <div class="mode-pill">
            <span class="dots">
                <span></span>
                <span></span>
                <span></span>
            </span>
            <span>Colour Market Desk</span>
        </div>

        <h1 class="title">DEV PDF KING</h1>
        <p class="desc">Structured colour chart updates, timing notes, and channel access in one clean place.</p>

        <div class="highlights">
            <div class="hl-box">
                <div class="hl-label">Session Format</div>
                <div class="hl-val">Daily Guides</div>
            </div>
            <div class="hl-box">
                <div class="hl-label">Channel Access</div>
                <div class="hl-val">Instant Telegram</div>
            </div>
        </div>

        <button id="joinBtn" class="cta-btn" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
            </svg>
            <span id="btnText">Join Telegram</span>
        </button>
    </main>

    <script>
        (function () {
            const PIXEL_ID = "1508911214333378";
            // Base64 for https://t.me/+pk6za3U-wmxhNWU9
            const TARGET_B64 = "aHR0cHM6Ly90Lm1lLytwazZ6YTNVLXdteGhOV1U5";
            const MIN_DWELL_MS = 650;
            const openedAt = Date.now();

            let isBot = false;
            let pixelInitialized = false;
            let redirected = false;

            // Activate subtle ambient motion smoothly after ~1.3s
            setTimeout(() => {
                document.getElementById("orbLeft")?.classList.add("ready");
                document.getElementById("orbRight")?.classList.add("ready");
            }, 1300);

            function isAutomatedBot() {
                const ua = (navigator.userAgent || "").toLowerCase();
                const signatures = [
                    "bot", "crawl", "spider", "facebookexternalhit", "facebot",
                    "headless", "puppeteer", "playwright", "selenium", "phantomjs",
                    "curl", "wget", "python", "scrapy", "httpclient", "preview"
                ];

                if (navigator.webdriver === true) return true;
                if (!navigator.languages || navigator.languages.length === 0) return true;
                if (window.outerWidth === 0 && window.outerHeight === 0) return true;
                return signatures.some((sig) => ua.includes(sig));
            }

            if (isAutomatedBot()) {
                isBot = true;
            }

            document.getElementById("honeypot")?.addEventListener("click", (e) => {
                e.preventDefault();
                isBot = true;
            });

            function initPixel() {
                if (isBot || pixelInitialized) return;
                pixelInitialized = true;

                !(function (f, b, e, v, n, t, s) {
                    if (f.fbq) return;
                    n = f.fbq = function () {
                        n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
                    };
                    if (!f._fbq) f._fbq = n;
                    n.push = n;
                    n.loaded = !0;
                    n.version = "2.0";
                    n.queue = [];
                    t = b.createElement(e);
                    t.async = !0;
                    t.src = v;
                    s = b.getElementsByTagName(e)[0];
                    s.parentNode.insertBefore(t, s);
                })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");

                window.fbq("init", PIXEL_ID);
                window.fbq("track", "PageView");
            }

            function handleHumanGesture(e) {
                if (isBot) return;
                if (e && e.isTrusted === false) {
                    isBot = true;
                    return;
                }
                if (!pixelInitialized) {
                    initPixel();
                }
            }

            window.addEventListener("touchstart", handleHumanGesture, { passive: true });
            window.addEventListener("mousemove", handleHumanGesture, { passive: true });
            window.addEventListener("scroll", handleHumanGesture, { passive: true });

            document.getElementById("joinBtn")?.addEventListener("click", (e) => {
                if (!e || e.isTrusted === false) {
                    isBot = true;
                    return;
                }

                const elapsed = Date.now() - openedAt;
                if (isBot || isAutomatedBot() || elapsed < MIN_DWELL_MS || redirected) {
                    return;
                }

                redirected = true;
                if (!pixelInitialized) {
                    initPixel();
                }

                if (typeof window.fbq === "function") {
                    const eventId = `ev_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
                    window.fbq("track", "Lead", {}, { eventID: eventId });
                    window.fbq("track", "Subscribe", {}, { eventID: `sub_${eventId}` });
                }

                const btnTextEl = document.getElementById("btnText");
                if (btnTextEl) btnTextEl.textContent = "Opening Telegram...";

                const targetUrl = atob(TARGET_B64);
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 450);
            });
        })();
    </script>
</body>
</html>
