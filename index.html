<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Army | Join Free Telegram</title>

    <style>
        body {
            background-color: #e9ecef;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .card {
            background-color: #ffffff;
            width: 90%;
            max-width: 380px;
            border-radius: 40px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 26px;
            font-weight: 900;
            color: #111;
            margin: 10px 0 25px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn {
            background-color: #0d5cbb;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            padding: 14px 0;
            width: 85%;
            border-radius: 30px;
            display: inline-block;
            margin: 10px 0;
            box-shadow: 0 4px 10px rgba(13, 92, 187, 0.3);
        }

        /* Timer Setup */
        .timer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .numbers {
            font-size: 28px;
            font-weight: bold;
            color: #ef4453;
            letter-spacing: 2px;
        }

        .colon {
            font-size: 28px;
            font-weight: bold;
            color: #ef4453;
            margin-bottom: 20px;
        }

        .labels {
            font-size: 10px;
            font-weight: 800;
            color: #be12be;
            margin-top: 5px;
        }

        /* Footer Text */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            font-weight: bold;
            color: #000;
        }

        .agency {
            color: #ef4453;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 👇 DEV ARMY LOGO (PNG) YAHAN AAYEGA 👇 -->
        <img src="dev_army_logo.png" alt="Dev Army" class="profile-img">
        
        <h1>DEV ARMY</h1>
        
        <!-- Button 1 -->
        <a href="#" class="btn" onclick="fireSubscribeAndGo(event)">🚀 Join Free Telegram</a>
        
        <!-- Exact Timer Design -->
        <div class="timer-container">
            <div class="time-box">
                <span class="numbers">00</span>
                <span class="labels">HOURS</span>
            </div>
            <span class="colon">:</span>
            <div class="time-box">
                <span class="numbers">00</span>
                <span class="labels">MINUTES</span>
            </div>
            <span class="colon">:</span>
            <div class="time-box">
                <span class="numbers" id="sec">03</span>
                <span class="labels">SECONDS</span>
            </div>
        </div>

        <!-- Button 2 -->
        <a href="#" class="btn" onclick="fireSubscribeAndGo(event)">🚀 Join Free Telegram</a>

        <!-- Footer -->
        <div class="footer">
            Ads managed by <span class="agency">DevArmyAdvertising</span>
        </div>
    </div>

    <script>
        // Yahan tumhara link pehle se set hai
        const TELEGRAM_LINK = "https://t.me/+euf1Rmi_ToVlMmFl"; 
        
        let timeLeft = 3; 

        function fireSubscribeAndGo(e) {
            if(e) e.preventDefault(); 
            
            // 🚨 YAHAN CHANGE KIYA HAI - Ab ye 'Subscribe' fire karega 🚨
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Subscribe'); 
            }
            
            // Redirect
            setTimeout(() => {
                window.location.href = TELEGRAM_LINK;
            }, 500);
        }

        // Timer Logic
        const timerInterval = setInterval(() => {
            timeLeft--;
            let displayTime = "0" + timeLeft;
            document.getElementById('sec').textContent = displayTime;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                fireSubscribeAndGo(); 
            }
        }, 1000);
    </script>

</body>
</html>
