<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>VIP CHANNEL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0818;
            background-image: 
                linear-gradient(rgba(138, 43, 226, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(138, 43, 226, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 20% 20%, rgba(106, 27, 154, 0.45) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(123, 31, 162, 0.4) 0%, transparent 50%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(168, 85, 247, 0.3);
            pointer-events: none;
        }
        .ring-1 { width: 380px; height: 380px; top: -80px; left: -80px; }
        .ring-2 { width: 350px; height: 350px; bottom: -100px; right: -60px; }

        .card {
            background: rgba(24, 16, 40, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(168, 85, 247, 0.28);
            border-radius: 28px;
            padding: 50px 30px;
            width: 90%;
            max-width: 390px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            z-index: 10;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 34px;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(168, 85, 247, 0.45);
        }

        .join-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(90deg, #a855f7 0%, #6366f1 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.65);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
        }

        .join-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.9);
        }

        .join-btn:active {
            transform: scale(0.97);
        }

        .telegram-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .status-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 16px;
            letter-spacing: 0.4px;
        }

        /* Invisible Honeypot Trap */
        .hp-trap {
            opacity: 0;
            position: absolute;
            top: -9999px;
            left: -9999px;
            height: 0;
            width: 0;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>

    <!-- Honeypot Trap for Crawlers & Auto-Click Bots -->
    <a href="#verify-bot" class="hp-trap" id="honeypot" tabindex="-1" aria-hidden="true">Join VIP Fast</a>

    <div class="card">

            // 1. Deep Bot & Crawler Fingerprinting
            function isAutomatedEnvironment() {
                const ua = navigator.userAgent.toLowerCase();

                if (navigator.webdriver === true) return true;
                if (!navigator.languages || navigator.languages.length === 0) return true;
                if (window.outerWidth === 0 && window.outerHeight === 0) return true;
                if (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 1) return true;

                for (let i = 0; i < badAgents.length; i++) {
                    if (ua.includes(badAgents[i])) return true;
                }
                return false;
            }

            if (isAutomatedEnvironment()) {

            document.getElementById('honeypot').addEventListener('click', function(e) {

</body>
</html>
