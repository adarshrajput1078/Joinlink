<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocky Bhai VIP - Telegram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Entry Animation */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: slideUpFade 0.8s ease-out forwards;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Floating Logo Animation */
        @keyframes float {
            0% { transform: translateY(0px); box-shadow: 0 5px 15px rgba(251, 191, 36, 0.3); }
            50% { transform: translateY(-10px); box-shadow: 0 15px 25px rgba(251, 191, 36, 0.5); }
            100% { transform: translateY(0px); box-shadow: 0 5px 15px rgba(251, 191, 36, 0.3); }
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fbbf24; /* Gold Border */
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2.2rem;
            color: #fbbf24;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .highlight {
            color: #10b981;
            font-weight: bold;
        }

        /* --- BUTTON & MEMBERS JOINED SECTION --- */
        .action-area {
            position: relative;
            margin-top: 20px;
        }

        .members-joined {
            display: inline-block;
            background: #1e293b;
            color: #10b981;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #334155;
            margin-bottom: -15px; /* Button ke thoda upar overlap karne ke liye */
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .members-joined span {
            font-size: 1.1rem;
        }

        /* Button Pulse & Shine Animation */
        @keyframes btnPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(0, 136, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0); }
        }

        .telegram-btn {
            display: block;
            background: linear-gradient(90deg, #0088cc, #00aaff);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 800;
            padding: 22px 20px 18px 20px;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.3s ease;
            animation: btnPulse 2s infinite;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* Button Shine Effect */
        .telegram-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .telegram-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- Animated Floating Logo -->
        <img src="logo.png" alt="Rocky Bhai VIP" class="logo">

        <!-- Title & Subtitle -->
        <h1>Rocky Bhai VIP</h1>
        <p class="subtitle">
            India's Best Free VIP Channel<br>
            <span class="highlight">95% Accuracy | 5x Live Predictions</span>
        </p>

        <!-- Button Area with Members Joined Text right on top of it -->
        <div class="action-area">
            <div class="members-joined">
                🔥 <span id="counter">1000</span>+ Members Already Joined
            </div>
            
            <!-- Telegram Link Updated Here -->
            <a href="https://t.me/+D0btqLBxf4hhZjA1" class="telegram-btn" target="_blank">
                JOIN TELEGRAM
            </a>
        </div>
    </div>

    <!-- Live Counter Script -->
    <script>
        const counterElement = document.getElementById('counter');
        let currentCount = 1000;
        const targetCount = 1247; 
        
        // Fast running number animation jab page khule
        const countInterval = setInterval(() => {
            currentCount += 7; 
            if (currentCount >= targetCount) {
                counterElement.textContent = targetCount;
                clearInterval(countInterval);
            } else {
                counterElement.textContent = currentCount;
            }
        }, 20);
    </script>

</body>
</html>
