<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="facebook-domain-verification" content="t74cmci9s8wdic96dcgvg83r8ldqz7" />
    
    <title>SURESHOT - Signals Active</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: #030712;
            background-image: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 24px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.05);
            position: relative;
        }

        /* Top Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #38bdf8;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        /* Headings */
        h1 {
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .highlight {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            font-size: 28px;
            display: block;
            margin-bottom: 40px;
        }

        /* Timer */
        .timer {
            font-family: 'Orbitron', sans-serif;
            font-size: 55px;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-bottom: 10px;
        }

        .subtext {
            font-size: 11px;
            color: #64748b;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 40px;
        }

        /* CTA Button */
        .cta-btn {
            display: block;
            width: 100%;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: none;
            cursor: pointer;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(255,255,255,0.1);
        }

        .cta-btn:active {
            transform: translateY(1px);
        }

        /* Footer */
        .footer {
            margin-top: 35px;
            font-size: 10px;
            color: #334155;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">
            <div class="dot"></div>
            SIGNALS ACTIVE
        </div>

        <h1>ONLY NUMBER</h1>
        <span class="highlight">SURESHOT</span>

        <div class="timer" id="countdown">04:54</div>
        <div class="subtext">INVITE VALIDATED</div>

        <a href="https://t.me/+LRtglAEgxrtlNDI1" class="cta-btn" id="joinBtn">
            JOIN TELEGRAM NOW
        </a>

        <div class="footer">
            ADS BY @rockymanger
        </div>
    </div>

    <script>
        let timeInSecs = 294; 
        const timerElement = document.getElementById("countdown");

        const updateTimer = setInterval(() => {
            let minutes = Math.floor(timeInSecs / 60);
            let seconds = timeInSecs % 60;

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            timerElement.innerHTML = `${minutes}:${seconds}`;

            if (timeInSecs > 0) {
                timeInSecs--;
            }
        }, 1000);
    </script>
</body>
</html>
