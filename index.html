<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DEV ARMY - Smart Panel Access</title>

    <!-- Meta Pixel Code -->

    <style>
        /* ===== COMPLETE STYLING ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(145deg, #111927, #0d1520);
            border-radius: 28px;
            padding: 40px 24px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #f5c842, #ff8a00, #f5c842, #ff8a00);
            background-size: 400% 400%;
            border-radius: 30px;
            z-index: -1;
            animation: glowBorder 3s ease infinite;
            opacity: 0.4;
        }

        @keyframes glowBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== TIMER ===== */
        .timer-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .timer-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(#f5c842 0deg, #1a2332 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            position: relative;
        }

        .timer-circle-inner {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #0d1520;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .timer-number {
            font-size: 48px;
            font-weight: 800;
            color: #f5c842;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .timer-label {
            font-size: 11px;
            color: #667799;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #1a2332;
            border-radius: 4px;
            margin: 16px 0 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5c842, #ff8a00);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        /* ===== MAIN MESSAGE ===== */
        .main-message {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .main-message .highlight {
            background: linear-gradient(135deg, #f5c842, #ff8a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 24px;
        }

        .sub-message {
            font-size: 14px;
            color: #8899bb;
            margin-bottom: 16px;
        }

        .sub-message strong {
            color: #fff;
        }

        /* ===== STATUS ===== */
        .status-text {
            font-size: 13px;
            color: #667799;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        .status-text .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f5c842;
            margin-right: 8px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ===== REDIRECTING ===== */
        .redirecting {
            display: none;
            margin-top: 12px;
            padding: 10px;
            background: rgba(245, 200, 66, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(245, 200, 66, 0.15);
            color: #f5c842;
            font-size: 14px;
            font-weight: 600;
        }

        .redirecting.show {
            display: block;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== MINI FEATURES ===== */
        .mini-features {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            font-size: 11px;
            color: #445566;
        }

        .mini-features span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== SUBSCRIBE CONFIRMATION (Hidden) ===== */
        .subscribe-confirm {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(0, 255, 150, 0.06);
            border: 1px solid rgba(0, 255, 150, 0.15);
            border-radius: 12px;
            color: #00d4aa;
            font-size: 13px;
            font-weight: 500;
        }

        .subscribe-confirm.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            .container { padding: 28px 16px 24px; }
            .main-message { font-size: 18px; }
            .main-message .highlight { font-size: 20px; }
            .timer-wrapper { width: 100px; height: 100px; }
            .timer-circle { width: 100px; height: 100px; }
            .timer-circle-inner { width: 84px; height: 84px; }
            .timer-number { font-size: 38px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== TIMER ===== -->
        <div class="timer-wrapper">
            <div class="timer-circle" id="timerCircle">
                <div class="timer-circle-inner">
                    <div class="timer-number" id="timerDisplay">3</div>
                    <div class="timer-label">Seconds</div>
                </div>
            </div>
        </div>

        <!-- ===== PROGRESS BAR ===== -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- ===== MAIN MESSAGE ===== -->
        <div class="main-message">
            🚀 <span class="highlight">Aapki Success</span><br />
            Hamari Jimmedari ✅
        </div>

        <div class="sub-message">
            <strong>DEV ARMY</strong> • Analytical Panel • 32ms Speed
        </div>

        <!-- ===== STATUS ===== -->
        <div class="status-text">
            <span class="dot"></span>
            <span id="statusMessage">Redirecting in 3 seconds...</span>
        </div>

        <!-- ===== REDIRECTING NOTIFICATION ===== -->
        <div class="redirecting" id="redirectingBox">
            ✅ Redirecting to DEV ARMY...
        </div>

        <!-- ===== SUBSCRIBE CONFIRMATION (Track Subscribe) ===== -->
        <div class="subscribe-confirm" id="subscribeConfirm">
            🎉 <strong>Subscribe Tracked!</strong> — You joined DEV ARMY!
        </div>

        <!-- ===== MINI FEATURES ===== -->
        <div class="mini-features">
            <span>🔒 Secure</span>
            <span>⚡ 32ms</span>
            <span>📱 578 Members</span>
        </div>

    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const TELEGRAM_LINK = 'https://t.me/+EV9k_vc6EjVlYWFl';
        const TIMER_SECONDS = 3;
        const UPDATE_INTERVAL_MS = 50;

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const timerDisplay = document.getElementById('timerDisplay');
        const timerCircle = document.getElementById('timerCircle');
        const progressFill = document.getElementById('progressFill');
        const statusMessage = document.getElementById('statusMessage');
        const redirectingBox = document.getElementById('redirectingBox');
        const subscribeConfirm = document.getElementById('subscribeConfirm');

        // ============================================================
        // TIMER LOGIC
        // ============================================================
        let timeLeft = TIMER_SECONDS;
        let startTime = Date.now();
        let totalDuration = TIMER_SECONDS * 1000;
        let redirectDone = false;
        let hasInteracted = false;

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, totalDuration - elapsed);
            const secondsRemaining = remaining / 1000;

            if (secondsRemaining > 0.5) {
                timerDisplay.textContent = Math.ceil(secondsRemaining);
            } else if (secondsRemaining > 0) {
                timerDisplay.textContent = '1';
            } else {
                timerDisplay.textContent = '0';
            }

            const progress = 1 - (remaining / totalDuration);
            const degrees = progress * 360;
            timerCircle.style.background = `conic-gradient(#f5c842 ${degrees}deg, #1a2332 ${degrees}deg)`;
            progressFill.style.width = `${progress * 100}%`;

            const secs = Math.ceil(secondsRemaining);
            if (secs > 0) {
                statusMessage.textContent = `⏳ Redirecting in ${secs} second${secs > 1 ? 's' : ''}...`;
            } else {
                statusMessage.textContent = '🚀 Redirecting now...';
            }

            if (remaining <= 0 && !redirectDone) {
                redirectDone = true;
                performRedirect();
                return;
            }

            if (!redirectDone) {
                requestAnimationFrame(updateTimer);
            }
        }

        // ============================================================
        // REDIRECT FUNCTION (Track Subscribe Click)
        // ============================================================
        function performRedirect() {
            redirectingBox.classList.add('show');
            statusMessage.textContent = '✅ Redirecting to DEV ARMY...';

            // ============================================================
            // 🔥 TRACK "SUBSCRIBE" EVENT — Meta Pixel ke liye
            // ============================================================
            if (typeof fbq === 'function') {
                // Click event track karo
                fbq('track', 'Click', {
                    content_name: 'Telegram_Redirect_Timer',
                    destination: TELEGRAM_LINK
                });

                // 🔥 SUBSCRIBE event — custom event
                fbq('trackCustom', 'TelegramSubscribe', {
                    source: 'landing_page_timer',
                    channel: 'DEV_ARMY',
                    timestamp: Date.now()
                });

                // Standard "Lead" event bhi fire karo
                fbq('track', 'Lead', {
                    content_name: 'DEV_ARMY_Subscribe',
                    content_category: 'Telegram_Channel'
                });

                console.log('✅ Subscribe tracked: TelegramSubscribe event fired');
            }

            // ============================================================
            // SHOW SUBSCRIBE CONFIRMATION (Local feedback)
            // ============================================================
            subscribeConfirm.classList.add('show');

            // ============================================================
            // REDIRECT TO TELEGRAM
            // ============================================================
            setTimeout(function() {
                // Open Telegram in new tab (so user can come back)
                window.open(TELEGRAM_LINK, '_blank');

                // Show confirmation that subscribe was tracked
                statusMessage.textContent = '✅ Subscribe Tracked! Welcome to DEV ARMY 🎉';
                subscribeConfirm.textContent = '🎉 Subscribe Tracked Successfully!';

                // 🔥 Track that redirect was opened (for CPC optimization)
                if (typeof fbq === 'function') {
                    fbq('trackCustom', 'TelegramOpened', {
                        method: 'timer_auto_redirect'
                    });
                }

                // After 2 seconds, redirect main window to Telegram too (optional)
                // Or keep them on the landing page with thank you message
                // window.location.href = TELEGRAM_LINK; // Uncomment if you want full redirect

            }, 600);
        }

        // ============================================================
        // START TIMER
        // ============================================================
        startTime = Date.now();
        updateTimer();

        // ============================================================
        // MANUAL CLICK TRACKING (If user clicks on page before timer)
        // ============================================================
        document.addEventListener('click', function(e) {
            if (!hasInteracted) {
                hasInteracted = true;
                if (typeof fbq === 'function') {
                    fbq('trackCustom', 'PageInteraction', {
                        element: e.target.tagName
                    });
                }
            }
        });

        document.addEventListener('touchstart', function() {
            if (!hasInteracted) {
                hasInteracted = true;
                if (typeof fbq === 'function') {
                    fbq('trackCustom', 'PageInteraction', {
                        element: 'touch'
                    });
                }
            }
        });

        // ============================================================
        // META PIXEL - PAGE VIEW (Already fired in <head>)
        // ============================================================

        // ============================================================
        // FALLBACK: Track if user stays on page after Telegram opens
        // ============================================================
        let visibilityTimer = 0;
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // User switched to Telegram app - good sign!
                if (typeof fbq === 'function') {
                    fbq('trackCustom', 'SwitchedToTelegram', {
                        timestamp: Date.now()
                    });
                }
                console.log('📱 User switched to Telegram app');
            } else {
                // User came back to landing page
                if (typeof fbq === 'function') {
                    fbq('trackCustom', 'ReturnedFromTelegram', {
                        timestamp: Date.now()
                    });
                }
                console.log('🔄 User returned from Telegram app');
            }
        });

        // ============================================================
        // PERFORMANCE LOGGING
        // ============================================================
        if (window.performance && window.performance.timing) {
            const loadTime = performance.timing.loadEventEnd - performance.timing.navigationStart;
            console.log('⏱️ Page loaded in:', loadTime, 'ms');
        }

        console.log('🚀 DEV ARMY Timer Landing Page with Subscribe Tracking');
        console.log('⏱️ Timer:', TIMER_SECONDS, 'seconds');
        console.log('🔗 Redirect to:', TELEGRAM_LINK);
        console.log('📊 Meta Pixel: 1017597647655738');
        console.log('✅ Subscribe tracking active');
    </script>

</body>
</html>
